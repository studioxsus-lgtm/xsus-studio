<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsus Logo | AI Logo Generator & Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            blue: '#00f0ff',
                            purple: '#7000ff',
                            pink: '#ff007f',
                            dark: '#0a0a12',
                            card: 'rgba(18, 18, 35, 0.6)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(18, 18, 35, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .text-gradient {
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 50%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-mark { width: 50px; height: 50px; object-fit: contain; flex: none; }
        .logo-module-links { display: flex; gap: clamp(8px, 1.4vw, 24px); white-space: nowrap; }
        .logo-module-menu { display: none; position: relative; }
        .logo-module-menu summary { cursor: pointer; list-style: none; padding: 8px; }
        .logo-module-menu summary::-webkit-details-marker { display: none; }
        @media (max-width: 739px) {
            .logo-module-links { display: none; }
            .logo-module-menu { display: block; }
            .logo-mark { width: 36px; height: 36px; }
        }
        @media (max-width: 400px) {
            nav.glass-panel { padding-inline: 6px; }
            nav .whitespace-nowrap { gap: 3px; }
            nav .whitespace-nowrap > span { font-size: 14px; }
            nav .flex.items-center.gap-3 { gap: 4px; }
        }
    </style>
<link rel="stylesheet" href="assets/xsus-logo/studio.css?v=cc8bbbaa">
</head>
<body class="bg-[#06060c] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-cyber-blue selection:text-black">

    <!-- NAVIGATION BAR -->
    <nav class="sticky top-0 left-0 w-full z-50 glass-panel border-b border-white/10 px-4 md:px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 whitespace-nowrap">
                <img class="logo-mark" src="assets/xsus-logo/xsus-logo.webp" width="50" height="50" alt="">
                <span class="text-lg font-bold tracking-wider text-white">XSUS <span class="text-cyber-blue">LOGO</span></span>
            </a>

            <!-- Desktop Menu -->
            <div class="logo-module-links items-center font-medium text-xs text-slate-300">
                <a href="ai.html" class="hover:text-cyber-blue transition">Xsus AI</a>
                <a href="app.html" class="hover:text-cyber-blue transition">Xsus App</a>
                <a href="web.html" class="hover:text-cyber-blue transition">Xsus Web</a>
                <a href="game.html" class="hover:text-cyber-blue transition">Xsus Game</a>
                <a href="logo.html" class="text-cyber-blue font-semibold border-b-2 border-cyber-blue pb-1">Xsus Logo</a>
                <a href="domain.html" class="hover:text-cyber-blue transition">Xsus Domain</a>
            </div>

            <details class="logo-module-menu text-sm"><summary aria-label="Modules">☰</summary><div class="absolute left-1/2 -translate-x-1/2 bg-[#171421] p-4 grid gap-3"><a href="ai.html">Xsus AI</a><a href="app.html">Xsus App</a><a href="web.html">Xsus Web</a><a href="game.html">Xsus Game</a><a href="logo.html">Xsus Logo</a><a href="domain.html">Xsus Domain</a></div></details>
<!-- Language Selector & CTA -->
            <div class="flex items-center gap-3">
                <div class="glass-panel px-2.5 py-1.5 rounded-xl border border-white/10 flex items-center gap-1.5 text-xs font-bold text-slate-300">
                    <i data-lucide="globe" class="w-3.5 h-3.5 text-cyber-blue"></i>
                    <select id="language-select" class="bg-transparent text-white outline-none cursor-pointer">
                        <option value="en" class="bg-[#0a0a12] text-white">EN</option>
                        <option value="sq" class="bg-[#0a0a12] text-white">SQ</option>
                        <option value="fr" class="bg-[#0a0a12] text-white">FR</option>
                    </select>
                </div>

                <div data-xsus-auth-host class="flex items-center gap-2 text-xs font-semibold"></div>
                <a href="#studio-section" class="hidden lg:inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gradient-to-r from-cyber-blue to-cyber-purple text-black font-bold text-xs hover:opacity-90 transition shadow-[0_0_20px_rgba(0,240,255,0.3)]">
                    <i data-lucide="palette" class="w-3.5 h-3.5"></i>
                    <span data-i18n="nav-create">Create Logo</span>
                </a>
            </div>
        </div>
    </nav>

<main id="studio-section" class="w-full flex-1 p-3 md:p-6"><p role="status">Loading XSUS Logo Studio…</p></main>
<footer class="mt-auto py-8 border-t border-white/10 glass-panel text-center text-xs text-slate-400"><p>XSUS STUDIO — THE X IDENTITY</p><p>© 2026 XSUS Studio</p></footer>
<script>lucide.createIcons();</script>
<script type="module" src="assets/xsus-logo/entry.mjs?v=20261125-6"></script>
<script type="module" src="assets/js/xsus-auth-ui.js"></script>
</body></html>
