    <!-- SCRIPT -->
    <script>
        let smartRouterFunc = null;
        import('./services/router.js').then(module => {
            if (module && module.smartRouter) {
                smartRouterFunc = module.smartRouter;
            }
        }).catch(err => {
            console.warn("SmartRouter nuk u ngarkua:", err);
        });

        function refreshIcons() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }
        refreshIcons();

        // 1. DICTIONARY SHUMËGJUHËSH
        const i18nData = {
            en: {
                "nav-start": "Launch AI",
                "hero-badge": "Real-Time Open Neural Engine",
                "hero-title1": "Ask Anything. Create Everything.",
                "hero-title2": "Powered by Xsus AI",
                "hero-desc": "Your live AI companion connected directly to advanced neural models for accurate answers in any language.",
                "chat-header": "Xsus Live Neural Assistant",
                "clear-btn": "Clear Chat",
                "ai-welcome": "Hello! I am connected to live AI models. Ask me anything, request information, or chat in Albanian, English, or French!",
                "input-placeholder": "Ask Xsus AI anything...",
                "btn-send": "Send",
                "thinking": "Thinking...",
                "sys-prompt": "You are Xsus AI, an advanced AI assistant created by Xsus Studio. Never call yourself OpenAI, ChatGPT, or LLM. Always state you are Xsus AI created by Xsus Studio. CRITICAL: You must reply ONLY in English unless requested otherwise."
            },
            sq: {
                "nav-start": "Nis AI",
                "hero-badge": "Motor Neural në Kohë Reale",
                "hero-title1": "Pyet Çdo Gjë. Krijo Çdo Gjë.",
                "hero-title2": "Mbështetur nga Xsus AI",
                "hero-desc": "Asistenti yt i drejtpërdrejtë i lidhur me modele të avancuara neurale për përgjigje të sakta në çdo gjuhë.",
                "chat-header": "Asistenti i Drejtpërdrejtë Xsus",
                "clear-btn": "Pastro Bisedën",
                "ai-welcome": "Përshëndetje! Jam i lidhur me modele AI në kohë reale. Më pyet çfarë të duash në Shqip, Anglisht apo Frëngjisht!",
                "input-placeholder": "Pyet Xsus AI për çdo gjë...",
                "btn-send": "Dërgo",
                "thinking": "Duke menduar...",
                "sys-prompt": "Ti je Xsus AI, një asistenti i avancuar i krijuar nga Xsus Studio. Kurrë mos e quaj veten OpenAI, ChatGPT apo LLM. Thuaj gjithmonë se je Xsus AI i krijuar nga Xsus Studio. KRITIKE: Duhet të përgjigjesh VETËM në gjuhën Shqipe për çdo pyetje që të bëhet."
            },
            fr: {
                "nav-start": "Lancer IA",
                "hero-badge": "Moteur Neural en Direct",
                "hero-title1": "Demandez Tout. Créez Tout.",
                "hero-title2": "Propulsé par Xsus AI",
                "hero-desc": "Votre compagnon IA en direct connecté aux modèles neuronaux avancés pour des réponses précises.",
                "chat-header": "Assistant en Direct Xsus",
                "clear-btn": "Effacer",
                "ai-welcome": "Bonjour ! Je suis connecté à des modèles IA en direct. Posez vos questions en français, anglais ou albanais !",
                "input-placeholder": "Posez une question à Xsus AI...",
                "btn-send": "Envoyer",
                "thinking": "En réflexion...",
                "sys-prompt": "Vous êtes Xsus AI, un assistant IA avancé créé par Xsus Studio. Ne vous appelez jamais OpenAI, ChatGPT ou LLM. Dites toujours que vous êtes Xsus AI créé par Xsus Studio. CRITIQUE : Vous devez répondre UNIQUEMENT en français."
            }
        };

        const langSelect = document.getElementById('language-select');
        let currentLang = 'en';

        function updateSystemPrompt() {
            if (conversationHistory.length > 0 && conversationHistory[0].role === 'system') {
                conversationHistory[0].content = i18nData[currentLang]["sys-prompt"] || i18nData["en"]["sys-prompt"];
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            const dictionary = i18nData[lang] || i18nData['en'];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dictionary[key]) el.textContent = dictionary[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dictionary[key]) el.placeholder = dictionary[key];
            });

            document.documentElement.lang = lang;
            if (langSelect) langSelect.value = lang;
            
            updateSystemPrompt();
            refreshIcons();
        }

        if (langSelect) {
            langSelect.addEventListener('change', (e) => setLanguage(e.target.value));
        }

        const userBrowserLang = navigator.language.slice(0, 2);
        if (['sq', 'fr', 'en'].includes(userBrowserLang)) {
            setLanguage(userBrowserLang);
        } else {
            setLanguage('en');
        }

        const xsusAiLogoHTML = `
            <div class="xsus-custom-logo shrink-0">
                <span class="logo-x">X</span>
                <span class="logo-sus">sus</span>
            </div>
        `;

        // 2. MOTORRI I AI
        let conversationHistory = [
            {
                role: 'system',
                content: i18nData[currentLang]["sys-prompt"]
            }
        ];

        const aiInput = document.getElementById('ai-input');
        const aiSendBtn = document.getElementById('ai-send-btn');
        const aiOutputBox = document.getElementById('ai-output-box');
        const clearChatBtn = document.getElementById('clear-chat');

        function cleanResponseText(rawText) {
            return rawText
                .replace(/\\n/g, '\n')
                .replace(/\\r/g, '')
                .replace(/^"|"$/g, '')
                .trim();
        }

        async function fetchAIResponse(userText) {
            conversationHistory.push({ role: 'user', content: userText });

            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: conversationHistory,
                        model: 'openai',
                        seed: Math.floor(Math.random() * 1000)
                    })
                });

                if (response.ok) {
                    let reply = await response.text();
                    reply = cleanResponseText(reply);
                    conversationHistory.push({ role: 'assistant', content: reply });
                    return reply;
                } else {
                    return currentLang === 'sq' ? "Ndodhi një shkëputje e përkohshme me serverin. Ju lutem provoni përsëri." :
                           currentLang === 'fr' ? "Une déconnexion temporaire est survenue. Veuillez réessayer." :
                           "A temporary disconnection occurred. Please try again.";
                }
            } catch (err) {
                return currentLang === 'sq' ? "Gabim në lidhje me rrjetin. Kontrolloni lidhjen me internetin." :
                       currentLang === 'fr' ? "Erreur de connexion réseau. Vérifiez votre accès internet." :
                       "Network connection error. Please check your internet connection.";
            }
        }

        async function handleAIResponse() {
            const text = aiInput.value.trim();
            if (!text) return;

            const userMsg = document.createElement('div');
            userMsg.className = "flex items-start gap-3 justify-end";
            userMsg.innerHTML = `
                <div class="glass-panel p-3.5 md:p-4 rounded-2xl rounded-tr-none text-sm text-slate-100 max-w-[85%] border-cyber-blue/30 bg-cyber-blue/10 leading-relaxed">
                    <p>${text}</p>
                </div>
                <div class="w-9 h-9 rounded-xl bg-cyber-blue flex items-center justify-center font-bold text-black text-xs shrink-0 shadow-[0_0_12px_rgba(0,240,255,0.4)]">
                    YOU
                </div>
            `;
            aiOutputBox.appendChild(userMsg);
            aiInput.value = '';
            aiOutputBox.scrollTop = aiOutputBox.scrollHeight;

            const loadingText = i18nData[currentLang]["thinking"] || i18nData["en"]["thinking"];
            const loadingMsg = document.createElement('div');
            loadingMsg.className = "flex items-start gap-3";
            loadingMsg.id = "loading-bubble";
            loadingMsg.innerHTML = `
                ${xsusAiLogoHTML}
                <div class="glass-panel p-3.5 md:p-4 rounded-2xl rounded-tl-none text-sm text-slate-400 max-w-[85%] animate-pulse">
                    ${loadingText}
                </div>
            `;
            aiOutputBox.appendChild(loadingMsg);
            aiOutputBox.scrollTop = aiOutputBox.scrollHeight;

            let reply = "";
            if (smartRouterFunc) {
                try {
                    const routerReply = await smartRouterFunc(text);
                    if (routerReply) {
                        reply = routerReply;
                        conversationHistory.push({ role: 'user', content: text });
                        conversationHistory.push({ role: 'assistant', content: reply });
                    }
                } catch (e) {
                    console.warn("Dështoi ekzekutimi i router.js:", e);
                }
            }

            if (!reply) {
                reply = await fetchAIResponse(text);
            }

            document.getElementById('loading-bubble')?.remove();

            const aiMsg = document.createElement('div');
            aiMsg.className = "flex items-start gap-3";
            aiMsg.innerHTML = `
                ${xsusAiLogoHTML}
                <div class="glass-panel p-3.5 md:p-4 rounded-2xl rounded-tl-none text-sm text-slate-200 max-w-[85%] leading-relaxed whitespace-pre-line">
                    <p>${reply}</p>
                </div>
            `;
            aiOutputBox.appendChild(aiMsg);
            aiOutputBox.scrollTop = aiOutputBox.scrollHeight;
            refreshIcons();
        }

        if (aiSendBtn) {
            aiSendBtn.onclick = handleAIResponse;
        }

        if (aiInput) {
            aiInput.onkeypress = function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleAIResponse();
                }
            };
        }

        if (clearChatBtn) {
            clearChatBtn.onclick = function() {
                conversationHistory = [
                    {
                        role: 'system',
                        content: i18nData[currentLang]["sys-prompt"]
                    }
                ];
                const welcomeText = i18nData[currentLang]["ai-welcome"] || i18nData["en"]["ai-welcome"];

                aiOutputBox.innerHTML = `
                    <div class="flex items-start gap-3">
                        ${xsusAiLogoHTML}
                        <div class="glass-panel p-4 rounded-2xl rounded-tl-none text-sm text-slate-200 max-w-[85%] leading-relaxed">
                            <p id="welcome-msg-text" data-i18n="ai-welcome">${welcomeText}</p>
                        </div>
                    </div>
                `;
                refreshIcons();
            };
        }
    </script>
