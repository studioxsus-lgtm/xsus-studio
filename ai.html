<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsus AI - Hybrid Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen relative flex flex-col justify-between">
    <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 p-[2px]"><div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center"><span class="font-extrabold text-cyan-400">X</span></div></div>
                <h1 class="font-bold text-xl text-white">Xsus AI</h1>
            </a>
            <a href="index.html" class="text-xs text-cyan-400 hover:underline">&larr; Back to Ecosystem</a>
        </div>
    </header>

    <main class="relative z-10 max-w-4xl mx-auto px-4 py-12 flex-1 w-full space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-bold text-white flex items-center justify-center gap-3"><i data-lucide="cpu" class="w-8 h-8 text-cyan-400"></i> Xsus AI Engine</h2>
            <p class="text-slate-400 text-sm">Interactive console for video scripts, code generation, and intelligent assistance.</p>
        </div>

        <div class="glass-panel-glow rounded-2xl border border-slate-800 overflow-hidden shadow-2xl h-[520px] flex flex-col">
            <div class="px-6 py-4 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between">
                <span class="font-semibold text-white text-sm">Interactive AI Console</span>
                <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-cyan-400">Clear chat</button>
            </div>
            <div id="chatStream" class="flex-1 p-6 overflow-y-auto space-y-4 custom-scrollbar bg-slate-950/40">
                <div class="flex gap-3 max-w-3xl">
                    <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center shrink-0"><i data-lucide="bot" class="w-4 h-4 text-cyan-400"></i></div>
                    <div class="glass-panel p-4 rounded-2xl rounded-tl-none border-slate-800 text-sm text-slate-200">
                        <p>Hello! I am Xsus AI. Ask me for a video script, creative text, or technical question!</p>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-slate-900/90 border-t border-slate-800">
                <form id="chatForm" onsubmit="handleChatSubmit(event)" class="flex gap-2 items-center">
                    <input type="text" id="userInput" placeholder="Ask Xsus AI anything..." class="flex-1 bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500/50">
                    <button type="submit" class="bg-cyan-500 text-slate-950 font-bold px-6 py-3 rounded-xl">Send</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="glass-panel border-t border-slate-800/80 mt-16 py-8 text-center text-xs text-slate-500">&copy; 2026 Xsus Studio. All rights reserved.</footer>
    <script src="script.js"></script>
</body>
</html>
