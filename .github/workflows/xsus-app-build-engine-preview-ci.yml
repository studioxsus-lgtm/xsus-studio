name: XSUS App Build Engine Preview CI
on:
  push:
    branches:
      - feature/xsus-app-build-engine
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify worker and owner-scoped preview
        run: npx vitest run tests/integration/xsus-app-build-engine-worker-preview-endpoint.test.js tests/integration/xsus-app-build-engine-owner-preview.test.js
