name: XSUS Private Write Coordinator Tests

on:
  push:
    branches:
      - main
    paths:
      - "assets/js/xsus-ai/adapters/xsus-private-write-coordinator.js"
      - "tests/unit/xsus-private-write-coordinator.test.js"
      - "tests/unit/xsus-database-idempotency-migration.test.js"
      - "tests/unit/xsus-idempotent-message-write-adapter.test.js"
      - "assets/js/xsus-ai/adapters/xsus-idempotent-message-write-adapter.js"
      - "assets/js/xsus-ai/adapters/xsus-supabase-idempotent-write-adapter.js"
      - "tests/unit/xsus-supabase-idempotent-write-adapter.test.js"
      - "tests/unit/xsus-database-idempotency-preflight.test.js"
      - "tests/unit/xsus-idempotent-persistence-recovery.test.js"
      - "tests/unit/xsus-private-idempotent-write-service.test.js"
      - "assets/js/xsus-ai/adapters/xsus-private-chat-persistence.js"
      - "assets/js/xsus-ai/app.js"
      - "assets/js/xsus-ai/chat.js"
      - "tests/unit/xsus-private-chat-persistence.test.js"
      - "assets/js/xsus-ai/adapters/xsus-private-idempotent-write-service.js"
      - "supabase/verification/xsus_ai_idempotency_preflight.sql"
      - "supabase/migrations/20261110_xsus_ai_message_operation_id.sql"
      - ".github/workflows/xsus-private-write-coordinator-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "assets/js/xsus-ai/adapters/xsus-private-write-coordinator.js"
      - "tests/unit/xsus-private-write-coordinator.test.js"
      - "tests/unit/xsus-database-idempotency-migration.test.js"
      - "tests/unit/xsus-idempotent-message-write-adapter.test.js"
      - "assets/js/xsus-ai/adapters/xsus-idempotent-message-write-adapter.js"
      - "assets/js/xsus-ai/adapters/xsus-supabase-idempotent-write-adapter.js"
      - "tests/unit/xsus-supabase-idempotent-write-adapter.test.js"
      - "tests/unit/xsus-database-idempotency-preflight.test.js"
      - "tests/unit/xsus-idempotent-persistence-recovery.test.js"
      - "tests/unit/xsus-private-idempotent-write-service.test.js"
      - "assets/js/xsus-ai/adapters/xsus-private-chat-persistence.js"
      - "assets/js/xsus-ai/app.js"
      - "assets/js/xsus-ai/chat.js"
      - "tests/unit/xsus-private-chat-persistence.test.js"
      - "assets/js/xsus-ai/adapters/xsus-private-idempotent-write-service.js"
      - "supabase/verification/xsus_ai_idempotency_preflight.sql"
      - "supabase/migrations/20261110_xsus_ai_message_operation_id.sql"
      - ".github/workflows/xsus-private-write-coordinator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinator-tests:
    name: Private Write Coordinator and Database Idempotency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run coordinator, adapters, recovery and integration security tests
        run: npx vitest run tests/unit/xsus-private-write-coordinator.test.js tests/unit/xsus-database-idempotency-migration.test.js tests/unit/xsus-idempotent-message-write-adapter.test.js tests/unit/xsus-supabase-idempotent-write-adapter.test.js tests/unit/xsus-database-idempotency-preflight.test.js tests/unit/xsus-idempotent-persistence-recovery.test.js tests/unit/xsus-private-idempotent-write-service.test.js tests/unit/xsus-private-chat-persistence.test.js
