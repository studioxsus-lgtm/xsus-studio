name: XSUS Private Write Coordinator Tests

on:
  push:
    branches:
      - main
    paths:
      - "assets/js/xsus-ai/adapters/xsus-private-write-coordinator.js"
      - "tests/unit/xsus-private-write-coordinator.test.js"
      - ".github/workflows/xsus-private-write-coordinator-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "assets/js/xsus-ai/adapters/xsus-private-write-coordinator.js"
      - "tests/unit/xsus-private-write-coordinator.test.js"
      - ".github/workflows/xsus-private-write-coordinator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinator-tests:
    name: Private Write Coordinator — 20 regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run coordinator regression tests
        run: npx vitest run tests/unit/xsus-private-write-coordinator.test.js
