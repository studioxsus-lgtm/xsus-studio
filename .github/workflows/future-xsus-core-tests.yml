name: Future XSUS Core Tests

on:
  push:
    branches: [future-xsus-core]
    paths:
      - packages/future-xsus-core/**
      - .github/workflows/future-xsus-core-tests.yml
  pull_request:
    branches: [future-xsus-core]
    paths:
      - packages/future-xsus-core/**
      - .github/workflows/future-xsus-core-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/future-xsus-core

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP transport dependency
        run: python -m pip install -r requirements-remote.txt
      - name: Test engine contracts
        run: python -m unittest discover -s tests/contracts -v
      - name: Test integration
        run: python -m unittest discover -s tests/integration -v
      - name: Test English language engine
        run: python -m unittest discover -s languages/en/tests -v
      - name: Measure official writing benchmarks with real v4 and v5 checkpoints
        timeout-minutes: 12
        run: |
          python -m languages.en.evaluation.official_written_evidence_v1 \
            --baseline languages/en/models/checkpoints/xsus-en-written-v4.json.gz \
            --candidate languages/en/models/checkpoints/xsus-en-written-v5.json.gz \
            > official-written-v4-v5-evidence.json
          python -c 'import json; r=json.load(open("official-written-v4-v5-evidence.json")); print(json.dumps({"checkpoint_sha256":r["checkpoint_sha256"],"benchmarks":r["comparison"]["benchmarks"],"assessment":r["assessment"]},indent=2))'
      - name: Measure older independent quality v2 and v3 holdouts
        timeout-minutes: 12
        run: |
          python -m languages.en.evaluation.compare \
            --baseline languages/en/models/checkpoints/xsus-en-written-v4.json.gz \
            --candidate languages/en/models/checkpoints/xsus-en-written-v5.json.gz \
            --evaluation languages/en/evaluation/quality-v2.jsonl \
            --training languages/en/data/training-v5.jsonl \
            > quality-v2-v4-v5-comparison.json
          python -m languages.en.evaluation.compare \
            --baseline languages/en/models/checkpoints/xsus-en-written-v4.json.gz \
            --candidate languages/en/models/checkpoints/xsus-en-written-v5.json.gz \
            --evaluation languages/en/evaluation/quality-v3.jsonl \
            --training languages/en/data/training-v5.jsonl \
            > quality-v3-v4-v5-comparison.json
          python -c 'import json; from pathlib import Path; files=[Path("quality-v2-v4-v5-comparison.json"),Path("quality-v3-v4-v5-comparison.json")]; print(json.dumps({f.name:{name:{k:v for k,v in d[name].items() if k in ("cases","accepted","exact_matches","preserved_all_facts")} for name in ("baseline","candidate")} for f in files for d in [json.loads(f.read_text())]},indent=2))'
      - name: Upload independent quality holdout comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-xsus-core-independent-quality-v2-v3
          path: |
            packages/future-xsus-core/quality-v2-v4-v5-comparison.json
            packages/future-xsus-core/quality-v3-v4-v5-comparison.json
          if-no-files-found: warn
      - name: Upload measured writing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-xsus-core-official-written-v4-v5
          path: packages/future-xsus-core/official-written-v4-v5-evidence.json
          if-no-files-found: warn
      - name: Run real synthetic feedback learning experiment
        timeout-minutes: 8
        run: |
          python -m languages.en.learning.synthetic_feedback_experiment_v1 \
            --output synthetic-feedback-experiment-v1.json
      - name: Upload synthetic feedback learning measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-xsus-core-synthetic-feedback-learning
          path: packages/future-xsus-core/synthetic-feedback-experiment-v1.json
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser API adapter
        working-directory: packages/future-xsus-core/clients/browser
        run: node --test

      - name: Test live HTTP intelligence integration
        timeout-minutes: 2
        run: |
          set -eu
          export XSUS_API_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$XSUS_API_TOKEN"
          export XSUS_INTELLIGENCE_ENABLED=true
          export XSUS_TEST_API_URL=http://127.0.0.1:18765
          work="$(mktemp -d)"
          python -m services.api.server --database "$work/sessions.db" --port 18765 > "$work/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$work"' EXIT
          for i in $(seq 1 50); do
            if curl -fsS "$XSUS_TEST_API_URL/healthz" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$work/server.log"; exit 1; fi
            sleep 0.2
          done
          curl -fsS "$XSUS_TEST_API_URL/healthz" >/dev/null
          node clients/browser/intelligence-live.mjs
