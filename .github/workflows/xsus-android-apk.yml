name: XSUS Android APK Compilation
on:
  workflow_dispatch:
  push:
    branches: [feature/xsus-app-build-engine]
    paths:
      - 'services/src/build-worker/android-*.js'
      - 'scripts/build-xsus-android.mjs'
      - '.github/workflows/xsus-android-apk.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ -f "$SDK/platforms/android-35/android.jar" && -x "$SDK/build-tools/35.0.0/aapt2" ]]; then
            echo 'Required Android SDK components already installed'
          else
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$MANAGER" ]]; then
              MANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
            fi
            test -x "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" --version
            set +o pipefail
            yes | "$MANAGER" --sdk_root="$SDK" --licenses
            license_status=$?
            set -o pipefail
            test "$license_status" -eq 0
            "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate and compile Android application
        run: |
          export XSUS_GRADLE_EXECUTABLE="$(command -v gradle)"
          node scripts/build-xsus-android.mjs
      - name: Upload compiled debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xsus-tasks-debug
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 14
