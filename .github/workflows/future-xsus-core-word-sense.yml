name: Future XSUS Core Word Sense Benchmark

on:
  push:
    branches: [future-xsus-core]
    paths:
      - .github/workflows/future-xsus-core-word-sense.yml
      - packages/future-xsus-core/languages/en/text/understanding/**
      - packages/future-xsus-core/languages/en/evaluation/word_sense_*
      - packages/future-xsus-core/languages/en/tests/test_word_sense_*
      - packages/future-xsus-core/languages/en/tests/test_sentence_meaning_*
      - packages/future-xsus-core/languages/en/tests/test_sentence_relations_*
      - packages/future-xsus-core/languages/en/tests/test_sentence_batch_*
      - packages/future-xsus-core/languages/en/tests/test_sentence_evidence_*
      - packages/future-xsus-core/languages/en/tests/test_sentence_phase2_*
      - packages/future-xsus-core/languages/en/tests/test_action_semantics_*
      - packages/future-xsus-core/languages/en/evaluation/sentence_meaning_*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/future-xsus-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run contextual sense and benchmark regression tests
        run: |
          python -m unittest languages.en.tests.test_word_sense_v1 languages.en.tests.test_word_sense_benchmark_v1 languages.en.tests.test_word_sense_quality_gate_v1 languages.en.tests.test_word_sense_challenge_v1 languages.en.tests.test_word_sense_context_guard_v1 languages.en.tests.test_word_sense_phase1_acceptance_v1 languages.en.tests.test_sentence_meaning_v1 languages.en.tests.test_sentence_relations_v1 languages.en.tests.test_sentence_meaning_benchmark_v1 languages.en.tests.test_sentence_meaning_quality_gate_v1 languages.en.tests.test_sentence_relations_benchmark_v1 languages.en.tests.test_sentence_batch_v1 languages.en.tests.test_sentence_batch_stress_v1 languages.en.tests.test_sentence_evidence_v1 languages.en.tests.test_sentence_evidence_benchmark_v1 languages.en.tests.test_sentence_phase2_acceptance_v1 languages.en.tests.test_action_semantics_v1 languages.en.tests.test_action_relations_v1 languages.en.tests.test_action_semantics_benchmark_v1 languages.en.tests.test_action_semantics_quality_gate_v1 languages.en.tests.test_role_semantics_v1 languages.en.tests.test_role_relations_v1 languages.en.tests.test_role_semantics_benchmark_v1 languages.en.tests.test_role_batch_v1 languages.en.tests.test_role_evidence_v1 languages.en.tests.test_role_batch_benchmark_v1 languages.en.tests.test_role_bulk_v1 languages.en.tests.test_role_bulk_benchmark_v1 languages.en.tests.test_expanded_english_v1 languages.en.tests.test_expanded_english_benchmark_v1 -v
      - name: Run read-only aggregate benchmark
        run: |
          python -m languages.en.evaluation.word_sense_benchmark_v1 > word-sense-benchmark-v1.json
          cat word-sense-benchmark-v1.json
      - name: Enforce conservative lexical diagnostic gate
        run: |
          python -m languages.en.evaluation.word_sense_quality_gate_v1 > word-sense-quality-gate-v1.json
          cat word-sense-quality-gate-v1.json
      - name: Run adversarial challenge diagnostics (non-gating)
        run: |
          python -m languages.en.evaluation.word_sense_challenge_report_v1 > word-sense-challenge-v1.json
          cat word-sense-challenge-v1.json
      - name: Compare opt-in context guard against both datasets
        run: |
          python -m languages.en.evaluation.word_sense_guard_comparison_v1 > word-sense-guard-comparison-v1.json
          cat word-sense-guard-comparison-v1.json
      - name: Enforce Phase 1 experimental milestone acceptance
        run: |
          python -m languages.en.evaluation.word_sense_phase1_acceptance_v1 > word-sense-phase1-acceptance-v1.json
          cat word-sense-phase1-acceptance-v1.json
      - name: Run Phase 2 sentence-frame diagnostic benchmark
        run: |
          python -m languages.en.evaluation.sentence_meaning_benchmark_v1 > sentence-meaning-benchmark-v1.json
          cat sentence-meaning-benchmark-v1.json
      - name: Run Phase 2 sentence relation benchmark
        run: |
          python -m languages.en.evaluation.sentence_relations_benchmark_v1 > sentence-relations-benchmark-v1.json
          cat sentence-relations-benchmark-v1.json
      - name: Run Phase 2 bounded batch stress diagnostic
        run: |
          python -m languages.en.evaluation.sentence_batch_stress_v1 > sentence-batch-stress-v1.json
          cat sentence-batch-stress-v1.json
      - name: Run Phase 2 evidence grouping diagnostic
        run: |
          python -m languages.en.evaluation.sentence_evidence_benchmark_v1 > sentence-evidence-benchmark-v1.json
          cat sentence-evidence-benchmark-v1.json
      - name: Enforce Phase 2 bounded sentence quality gate
        run: |
          python -m languages.en.evaluation.sentence_meaning_quality_gate_v1 > sentence-meaning-quality-v1.json
          cat sentence-meaning-quality-v1.json
      - name: Enforce final Phase 2 engineering acceptance
        run: |
          python -m languages.en.evaluation.sentence_phase2_acceptance_v1 > sentence-phase2-acceptance-v1.json
          cat sentence-phase2-acceptance-v1.json
      - name: Run Phase 3 authored action semantics benchmark
        run: |
          python -m languages.en.evaluation.action_semantics_benchmark_v1 > action-semantics-benchmark-v1.json
          cat action-semantics-benchmark-v1.json
      - name: Enforce Phase 3 action semantics quality gate
        run: |
          python -m languages.en.evaluation.action_semantics_quality_gate_v1 > action-semantics-quality-v1.json
          cat action-semantics-quality-v1.json
      - name: Run Phase 3 structural role diagnostic
        run: |
          python -m languages.en.evaluation.role_semantics_benchmark_v1 > role-semantics-benchmark-v1.json
          cat role-semantics-benchmark-v1.json
      - name: Run Phase 3.4 bounded role batch diagnostic
        run: |
          python -m languages.en.evaluation.role_batch_benchmark_v1 > role-batch-benchmark-v1.json
          cat role-batch-benchmark-v1.json
      - name: Enforce Phase 3.5 thousand-sentence bulk benchmark
        run: |
          python -m languages.en.evaluation.role_bulk_benchmark_v1 > role-bulk-benchmark-v1.json
          cat role-bulk-benchmark-v1.json
      - name: Enforce expanded English distinct-combination benchmark
        run: |
          python -m languages.en.evaluation.expanded_english_benchmark_v1 > expanded-english-benchmark-v1.json
          cat expanded-english-benchmark-v1.json
      - name: Publish aggregate report only
        uses: actions/upload-artifact@v4
        with:
          name: future-xsus-core-word-sense-v1-aggregate
          path: |
            packages/future-xsus-core/word-sense-benchmark-v1.json
            packages/future-xsus-core/word-sense-quality-gate-v1.json
            packages/future-xsus-core/word-sense-challenge-v1.json
            packages/future-xsus-core/word-sense-guard-comparison-v1.json
            packages/future-xsus-core/word-sense-phase1-acceptance-v1.json
            packages/future-xsus-core/sentence-meaning-benchmark-v1.json
            packages/future-xsus-core/sentence-meaning-quality-v1.json
            packages/future-xsus-core/sentence-relations-benchmark-v1.json
            packages/future-xsus-core/sentence-batch-stress-v1.json
            packages/future-xsus-core/sentence-evidence-benchmark-v1.json
            packages/future-xsus-core/sentence-phase2-acceptance-v1.json
            packages/future-xsus-core/action-semantics-benchmark-v1.json
            packages/future-xsus-core/action-semantics-quality-v1.json
            packages/future-xsus-core/role-semantics-benchmark-v1.json
            packages/future-xsus-core/role-batch-benchmark-v1.json
            packages/future-xsus-core/role-bulk-benchmark-v1.json
            packages/future-xsus-core/expanded-english-benchmark-v1.json
          if-no-files-found: error
