name: Hyper authenticated integration
on:
  workflow_dispatch:
  push:
    branches: [feature/xsus-ai-core]
    paths:
      - 'src/platform/xsus-app/hyper-evidence-runtime-integration.test.js'
      - 'src/platform/xsus-app/hyper-evidence-hmac-integration.test.js'
      - 'src/platform/xsus-app/hyper-v823*.js'
      - 'src/platform/xsus-app/hyper-evidence-owner-authorizer.js'
      - 'vitest.hyper-auth-integration.config.js'
      - '.github/workflows/hyper-auth-integration.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Auth, ownership, evidence integrity (mocked; no production secrets)
        run: npx vitest run --config vitest.hyper-auth-integration.config.js
