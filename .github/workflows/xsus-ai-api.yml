name: XSUS AI API - CI

on:
  push:
    branches:
      - feature/xsus-ai-core

  pull_request:
    branches:
      - feature/xsus-ai-core

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test XSUS AI Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project files
        run: |
          test -f package.json
          test -f server.js

      - name: Verify security integration file
        run: |
          echo "Current commit:"
          git rev-parse HEAD

          echo "Security integration files:"
          find apps/app/security -type f | sort

          echo "Expected file:"
          test -f apps/app/security/integration/security-integration-contracts.js

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Check server syntax
        run: node --check server.js
