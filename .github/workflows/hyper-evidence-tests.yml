name: Hyper evidence isolated tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/xsus-ai-core
    paths:
      - 'src/platform/xsus-app/hyper-owned-evidence-*.js'
      - '.github/workflows/hyper-evidence-tests.yml'
      - 'vitest.hyper-evidence.config.js'
      - 'scripts/hyper-live-readiness.mjs'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No package-lock.json in this branch; install from package.json.
      - run: npm install --no-audit --no-fund
      - name: Check live readiness script syntax (no production access)
        run: node --check scripts/hyper-live-readiness.mjs
      - name: Test owned evidence security and integration (mocked, no secrets)
        run: npx vitest run --config vitest.hyper-evidence.config.js
