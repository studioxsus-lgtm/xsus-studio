<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsus App - Studio & Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen relative flex flex-col justify-between">
    <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 p-[2px]"><div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center"><span class="font-extrabold text-cyan-400">X</span></div></div>
                <h1 class="font-bold text-xl text-white">Xsus App Studio</h1>
            </a>
            <a href="index.html" class="text-xs text-cyan-400 hover:underline">&larr; Back to Ecosystem</a>
        </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto px-4 py-12 flex-1 w-full space-y-8">
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-bold text-white flex items-center justify-center gap-3"><i data-lucide="smartphone" class="w-8 h-8 text-cyan-400"></i> Mobile Application Builder</h2>
            <p class="text-slate-400 text-sm">Customize colors, select modules, and preview your mobile app live.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div class="lg:col-span-7 space-y-6">
                <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="palette" class="w-5 h-5 text-cyan-400"></i> App Color Aesthetics</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <button onclick="setAppTheme('cyan')" class="p-3 rounded-xl border border-cyan-500/40 bg-cyan-950/30 text-cyan-400 text-xs font-medium">Cyber Cyan</button>
                        <button onclick="setAppTheme('purple')" class="p-3 rounded-xl border border-purple-500/40 bg-purple-950/30 text-purple-400 text-xs font-medium">Neon Purple</button>
                        <button onclick="setAppTheme('emerald')" class="p-3 rounded-xl border border-emerald-500/40 bg-emerald-950/30 text-emerald-400 text-xs font-medium">Emerald Bio</button>
                        <button onclick="setAppTheme('gold')" class="p-3 rounded-xl border border-amber-500/40 bg-amber-950/30 text-amber-400 text-xs font-medium">Solar Gold</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 flex justify-center">
                <div class="relative w-[300px] h-[550px] bg-slate-950 rounded-[45px] p-4 border-[6px] border-slate-800 shadow-2xl flex flex-col justify-between">
                    <div id="phoneScreen" class="flex-1 bg-slate-900 rounded-[28px] p-4 flex flex-col justify-between border border-cyan-500/50">
                        <div class="space-y-3 text-xs text-white font-bold">Xsus Mobile Live Preview</div>
                        <div class="text-xs text-slate-400">App ready for deployment on Google Play & App Store.</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="glass-panel border-t border-slate-800/80 mt-16 py-8 text-center text-xs text-slate-500">&copy; 2026 Xsus Studio. All rights reserved.</footer>
    <script src="script.js"></script>
</body>
</html>
