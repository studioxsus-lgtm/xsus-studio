<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XSUS Studio - Supabase Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0a12;
      color: #fff;
      padding: 24px;
      line-height: 1.6;
    }
    main {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      border: 1px solid #333;
      border-radius: 16px;
    }
    #status {
      overflow-wrap: anywhere;
      color: #00f0ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>XSUS Studio</h1>
    <h2>Supabase Connection & Database Test</h2>
    <p id="status">Po kontrollojmë konfigurimin...</p>
  </main>

  <script type="module">
    import { supabase } from "./services/supabase-client.js";

    const status = document.getElementById("status");

    async function runTest() {
      try {
        // 1. Testojmë sesionin e autentifikimit
        const { data: sessionData, error: authError } = await supabase.auth.getSession();
        if (authError) throw authError;

        // 2. Testojmë leximin nga baza e të dhënave (tabela projects që tashmë është e hapur)
        const { data: projectsData, error: dbError } = await supabase
          .from("projects")
          .select("*")
          .limit(1);

        if (dbError) throw dbError;

        status.innerHTML = 
          "✅ <strong>Sukses i plotë!</strong><br><br>" +
          "• Klienti Supabase u ngarkua.<br>" +
          "• Autentifikimi po punon.<br>" +
          "• Data API dhe baza e të dhënave po përgjigjen fiks siç duhet!";
          
      } catch (error) {
        console.error("Supabase test error:", error);

        status.innerHTML = 
          "❌ <strong>Testi dështoi:</strong> " + 
          (error.message || "Gabim i panjohur") + 
          "<br><br><small>Kontrollo konsolën (F12) për detaje.</small>";
      }
    }

    runTest();
  </script>
</body>
</html>
