<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XSUS Studio - Supabase Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0a12;
      color: #fff;
      padding: 24px;
      line-height: 1.6;
    }

    main {
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      border: 1px solid #333;
      border-radius: 16px;
    }

    #status {
      overflow-wrap: anywhere;
      color: #00f0ff;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>XSUS Studio</h1>
    <h2>Supabase Connection & Database Test</h2>
    <p id="status">Po kontrollojmë konfigurimin...</p>
  </main>

  <script type="module">
    import { supabase } from "./services/supabase-client.js";

    const status = document.getElementById("status");

    function report(message) {
      status.textContent += "\n" + message;
    }

    async function runTest() {
      status.textContent = "Klienti Supabase u ngarkua.";

      try {
        // Testi 1: gjendja e sesionit
        const {
          data: sessionData,
          error: authError
        } = await supabase.auth.getSession();

        if (authError) {
          report("AUTENTIKIMI: GABIM — " + authError.message);
          return;
        }

        report(
          sessionData.session
            ? "AUTENTIKIMI: Ka përdorues të identifikuar."
            : "AUTENTIKIMI: Nuk ka përdorues të identifikuar."
        );

        // Testi 2: leximi i sigurt i një fushe nga profiles
        const {
          data,
          error: dbError
        } = await supabase
          .from("profiles")
          .select("id")
          .limit(1);

        if (dbError) {
          report("DATA API: GABIM");
          report("Mesazhi: " + dbError.message);
          report("Kodi: " + (dbError.code || "nuk u dha"));
          return;
        }

        report("DATA API: Kërkesa u krye me sukses.");
        report("Rreshta të kthyer: " + data.length);
        report(
          "Përfundimi: API-ja iu përgjigj kërkesës për profiles."
        );

      } catch (error) {
        report("GABIM I PAPARASHIKUAR: " + error.message);
      }
    }

    runTest();
  </script>
</body>
</html>
